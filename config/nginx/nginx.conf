user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 256;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==================== LOGGING ====================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ==================== PERFORMANCE ====================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;
    server_tokens off;

    # ==================== GZIP ====================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # ==================== RATE LIMITING ====================
    # Chave por IP: no WiFi do restaurante vários clientes saem pelo mesmo IP (NAT),
    # então os limites precisam comportar o salão inteiro, não um celular só.
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    # 429 (e não 503) separa "excesso de requisição" de "backend fora"; o front só refaz 502/503/504
    limit_req_status 429;
    limit_conn_status 429;

    # ==================== BACKEND ====================
    # DNS do Docker relido a cada 10 s (proxy_pass $backend nos server): o nginx sobe sem o backend
    # e acha o IP novo quando o container é recriado. upstream{} estático resolvia uma vez só, e
    # `server ... resolve` exige nginx 1.27.3+ (rollback da imagem 1.25 não subiria com essa config).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    include /etc/nginx/conf.d/*.conf;
}
