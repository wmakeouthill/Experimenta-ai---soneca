<nav class="delivery-footer-nav delivery-footer-nav--totem">
  <button
    type="button"
    class="delivery-footer-nav__item"
    [class.delivery-footer-nav__item--ativo]="abaAtual() === 'inicio'"
    (click)="abaMudou.emit('inicio')"
  >
    <span class="delivery-footer-nav__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11.5 12 4l8 7.5" />
        <path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" />
      </svg>
    </span>
    <span class="delivery-footer-nav__label">Início</span>
  </button>

  <button
    type="button"
    class="delivery-footer-nav__item"
    [class.delivery-footer-nav__item--ativo]="abaAtual() === 'cardapio'"
    (click)="abaMudou.emit('cardapio')"
  >
    <span class="delivery-footer-nav__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="4" width="14" height="17" rx="2" />
        <path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1" />
        <path d="M8 10h8M8 14h8M8 18h5" />
      </svg>
    </span>
    <span class="delivery-footer-nav__label">Cardápio</span>
  </button>

  <button
    type="button"
    class="delivery-footer-nav__item"
    [class.delivery-footer-nav__item--ativo]="abaAtual() === 'carrinho'"
    (click)="abaMudou.emit('carrinho')"
  >
    <span class="delivery-footer-nav__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="20" r="1.4" />
        <circle cx="18" cy="20" r="1.4" />
        <path d="M2.5 3h2l2.2 11.4a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.6L21 7H6" />
      </svg>
    </span>
    @if (temItensCarrinho()) {
      <span class="delivery-footer-nav__badge">{{ totalCarrinho() }}</span>
    }
    <span class="delivery-footer-nav__label">Carrinho</span>
  </button>
</nav>
